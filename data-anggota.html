<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Data Anggota - CV. Ranjau Darat</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/dash.css">
<link rel="stylesheet" href="css/pendaftaran.css">
<link rel="stylesheet" href="css/data-anggota.css">
</head>
<body>
<p class="loading-page" id="loading">Memeriksa akun...</p>

<div class="shell" id="app" hidden>
  <aside class="side" id="side"></aside>

  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" type="button" aria-label="Buka menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 id="judul">Data Anggota</h1>
      <span class="tgl" id="tgl"></span>
      <div class="chip" id="chip"></div>
    </header>

    <main class="content">
      <section class="stats" aria-label="Ringkasan anggota">
        <div class="stat s-info">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.5c2.6.2 4.4 2 5 5"/></svg></div>
          <span class="lbl">Total Anggota</span><b data-stat="total">–</b><small>Akun yang sudah disetujui</small>
        </div>
        <div class="stat s-ok">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></div>
          <span class="lbl">Satpam</span><b data-stat="satpam">–</b><small data-stat="jk">&nbsp;</small>
        </div>
        <div class="stat s-warn">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></div>
          <span class="lbl">Pengurus</span><b data-stat="pengurus">–</b><small>Ketua, sekretaris, bendahara</small>
        </div>
        <div class="stat s-info">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
          <span class="lbl">Bergabung Bulan Ini</span><b data-stat="baru">–</b><small>Disetujui bulan ini</small>
        </div>
      </section>

      <section class="card" id="daftarAnggota"></section>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/sesi.js"></script>
<script src="js/layout.js"></script>
<script src="js/data-anggota.js"></script>
<script>
  wajibLogin(['ketua', 'sekretaris']).then((akun) => {
    if (!akun) return;
    const peran = ['ketua', 'sekretaris'].includes(akun.jabatan) ? akun.jabatan : 'ketua';
    pasangLayout({ peran, aktif: 'anggota', judul: 'Data Anggota', akun });
    document.getElementById('loading').hidden = true;
    document.getElementById('app').hidden = false;

    mulaiDataAnggota({
      wadah: document.getElementById('daftarAnggota'),
      saatData: (s) => {
        ['total', 'satpam', 'pengurus', 'baru'].forEach((k) => (document.querySelector('[data-stat="' + k + '"]').textContent = s[k]));
        document.querySelector('[data-stat="jk"]').textContent = s.laki + ' laki-laki · ' + s.perempuan + ' perempuan';
      }
    });

    sb.from('anggota').select('id').eq('status', 'menunggu').eq('jabatan', 'anggota')
      .then(({ data }) => setBadgeMenu('pendaftaran', data ? data.length : 0));
    sb.from('pengajuan_izin').select('id').eq('status', 'menunggu')
      .then(({ data }) => setBadgeMenu('absensi', data ? data.length : 0));
  });
</script>
</body>
</html>

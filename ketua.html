<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard Ketua - CV. Ranjau Darat</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/dash.css">
<link rel="stylesheet" href="css/pendaftaran.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<p class="loading-page" id="loading">Memeriksa akun...</p>

<div class="shell" id="app" hidden>
  <aside class="side" id="side"></aside>

  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" type="button" aria-label="Buka menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 id="judul">Dashboard Ketua</h1>
      <span class="tgl" id="tgl"></span>
      <div class="chip" id="chip"></div>
    </header>

    <main class="content">
      <section class="welcome">
        <div class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 11H5z"/><rect x="5" y="19" width="14" height="2" rx="1"/></svg></div>
        <div>
          <h2>Selamat datang, <span id="nama"></span></h2>
          <p>Kelola seluruh data dan pantau kegiatan organisasi.</p>
        </div>
      </section>

      <section class="stats" aria-label="Ringkasan">
        <div class="stat s-info">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.5c2.6.2 4.4 2 5 5"/></svg></div>
          <span class="lbl">Anggota Terdaftar</span><b data-stat="diterima">–</b><small data-stat="baruBulanIni-teks">&nbsp;</small>
        </div>
        <div class="stat s-warn">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
          <span class="lbl">Menunggu Verifikasi</span><b data-stat="menunggu">–</b><small>Perlu diperiksa</small>
        </div>
        <div class="stat s-ok">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></div>
          <span class="lbl">Satpam Aktif</span><b data-stat="satpamAktif">–</b><small>Sudah disetujui</small>
        </div>
        <div class="stat s-bad">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg></div>
          <span class="lbl">Ditolak</span><b data-stat="ditolak">–</b><small>Pendaftaran ditolak</small>
        </div>
      </section>

      <section class="card" id="pendaftaran"></section>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/sesi.js"></script>
<script src="js/layout.js"></script>
<script src="js/pendaftaran.js"></script>
<script>
  wajibLogin(['ketua']).then((akun) => {
    if (!akun) return;
    pasangLayout({ peran: 'ketua', aktif: location.hash === '#pendaftaran' ? 'pendaftaran' : 'dashboard', judul: 'Dashboard Ketua', akun });
    document.getElementById('nama').textContent = akun.nama;
    document.getElementById('loading').hidden = true;
    document.getElementById('app').hidden = false;

    mulaiPendaftaran({
      wadah: document.getElementById('pendaftaran'),
      saatData: (s) => {
        ['diterima', 'menunggu', 'satpamAktif', 'ditolak'].forEach((k) => (document.querySelector('[data-stat="' + k + '"]').textContent = s[k]));
        document.querySelector('[data-stat="baruBulanIni-teks"]').textContent = s.baruBulanIni + ' pendaftar baru bulan ini';
        setBadgeMenu('pendaftaran', s.menunggu);
      }
    });
    sb.from('pengajuan_izin').select('id').eq('status', 'menunggu')
      .then(({ data }) => setBadgeMenu('absensi', data ? data.length : 0));
    if (location.hash === '#pendaftaran') document.getElementById('pendaftaran').scrollIntoView();
  });
</script>
</body>
</html>

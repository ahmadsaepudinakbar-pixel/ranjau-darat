<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard Bendahara - CV. Ranjau Darat</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/dash.css">
<link rel="stylesheet" href="css/pendaftaran.css">
<link rel="stylesheet" href="css/gaji.css">
<style>
  .profil{display:grid;grid-template-columns:200px minmax(0,1fr);gap:1.4rem;align-items:start}
  .pf-foto{display:grid;gap:.6rem;justify-items:center;text-align:center}
  .pf-foto .img{width:100%;max-width:200px;aspect-ratio:3/4;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:.85rem;overflow:hidden}
  .pf-foto img{width:100%;height:100%;object-fit:cover;display:block}
  .pf-foto b{font-family:var(--f-display);font-size:1.35rem;color:var(--navy-900);line-height:1.1}
  .pf-foto small{color:var(--muted)}
  .pf-data{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 1.6rem;margin:0}
  .pf-data div{display:grid;grid-template-columns:9rem 1fr;gap:.6rem;padding:.6rem 0;border-bottom:1px dashed var(--line)}
  .pf-data dt{color:var(--muted)}
  .pf-data dd{margin:0;font-weight:600;overflow-wrap:anywhere}
  .note{margin:1rem 0 0;color:var(--muted);font-size:.9rem}
  .segera{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
  .segera .card{display:flex;gap:.9rem;align-items:center}
  .segera .ic{width:44px;height:44px;border-radius:10px;background:var(--paper);color:var(--navy-700);display:grid;place-items:center;flex:none}
  .segera .ic svg{width:22px;height:22px}
  .segera h3{margin:0;font-family:var(--f-display);font-size:1.25rem;color:var(--navy-900)}
  .segera p{margin:.1rem 0 0;color:var(--muted);font-size:.9rem}
  @media (max-width:760px){
    .profil{grid-template-columns:1fr}
    .pf-data{grid-template-columns:1fr}
    .pf-data div{grid-template-columns:8rem 1fr}
    .segera{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<p class="loading-page" id="loading">Memeriksa akun...</p>

<div class="shell" id="app" hidden>
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" type="button" aria-label="Buka menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 id="judul">Dashboard Bendahara</h1>
      <span class="tgl" id="tgl"></span>
      <div class="chip" id="chip"></div>
    </header>

    <main class="content">
      <section class="welcome">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></div>
        <div>
          <h2>Selamat datang, <span id="nama"></span></h2>
          <p>Kelola pemasukan, pengeluaran, dan saldo kas.</p>
        </div>
      </section>

      <section class="stats" aria-label="Ringkasan gaji">
        <div class="stat s-info">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h14a2 2 0 012 2v9a2 2 0 01-2 2H4z"/><path d="M4 7l11-3v3"/></svg></div>
          <span class="lbl">Total Gaji Dibayar</span><b data-s="total" style="font-size:1.5rem">–</b><small data-s="periode">&nbsp;</small>
        </div>
        <div class="stat s-ok">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
          <span class="lbl">Sudah Digaji</span><b data-s="sudah">–</b><small data-s="dari">&nbsp;</small>
        </div>
        <div class="stat s-warn">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
          <span class="lbl">Belum Digaji</span><b data-s="belum">–</b><small>Periode ini</small>
        </div>
        <div class="stat s-bad">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
          <span class="lbl">Rata-rata Gaji</span><b data-s="rata" style="font-size:1.5rem">–</b><small>Per anggota</small>
        </div>
      </section>

      <section class="card" id="gaji"></section>

      <section class="segera" aria-label="Fitur yang akan datang">
        <div class="card">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg></div>
          <div><h3>Transaksi Keuangan</h3><p>Catat pemasukan &amp; pengeluaran kas. Segera hadir.</p></div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/sesi.js"></script>
<script src="js/layout.js"></script>
<script src="js/gaji.js"></script>
<script>
  wajibLogin(['bendahara']).then((akun) => {
    if (!akun) return;
    pasangLayout({ peran: 'bendahara', aktif: location.hash === '#gaji' ? 'gaji' : 'dashboard', judul: 'Dashboard Bendahara', akun });
    document.getElementById('nama').textContent = akun.nama;
    document.getElementById('loading').hidden = true;
    document.getElementById('app').hidden = false;

    const s = (k) => document.querySelector('[data-s="' + k + '"]');
    mulaiGajiBendahara({
      wadah: document.getElementById('gaji'),
      bolehUbah: ['bendahara', 'admin'].includes(akun.jabatan),
      saatData: (d) => {
        s('total').textContent = fmtRp(d.totalDibayar);
        s('periode').textContent = d.periode;
        s('sudah').textContent = d.jumlahSlip;
        s('dari').textContent = 'dari ' + d.jumlahSatpam + ' anggota aktif';
        s('belum').textContent = d.belum;
        s('rata').textContent = d.jumlahSlip ? fmtRp(Math.round(d.totalDibayar / d.jumlahSlip)) : 'Rp0';
      }
    });
    if (location.hash === '#gaji') document.getElementById('gaji').scrollIntoView();
  });
</script>
</body>
</html>

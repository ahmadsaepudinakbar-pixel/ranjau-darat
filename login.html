<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Sistem - CV. Ranjau Darat</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<main class="stage">
  <section class="card" aria-live="polite">
    <a class="brand" href="index.html" title="Kembali ke halaman utama">
      <img src="assets/logo.png" alt="Logo CV. Ranjau Darat">
      <b>CV. RANJAU DARAT</b>
      <small>SATPAM &amp; ADMINISTRASI</small>
    </a>

    <!-- Ikon jabatan (muncul saat jabatan dipilih) -->
    <div class="role-icon" id="roleIcon" hidden></div>

    <h1 id="title">Login Sistem</h1>

    <form id="loginForm" novalidate>
      <label class="field">
        <span class="sr">Username</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" required>
      </label>
      <label class="field">
        <span class="sr">Password</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
        <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="button" class="peek" id="peek" aria-label="Tampilkan password">Lihat</button>
      </label>
      <p class="msg" id="msg" hidden></p>
      <button class="btn-login" type="submit" id="submitBtn">Login</button>
    </form>

    <!-- Pilihan jabatan (layar awal) -->
    <div id="chooser">
      <p class="choose-label">Pilih Akses Login:</p>
      <div class="roles">
        <button type="button" class="role r-ketua" data-role="ketua">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 11H5z"/><rect x="5" y="19" width="14" height="2" rx="1"/></svg>Ketua</button>
        <button type="button" class="role r-sekretaris" data-role="sekretaris">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Sekretaris</button>
        <button type="button" class="role r-bendahara" data-role="bendahara">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h14a2 2 0 012 2v9a2 2 0 01-2 2H4z"/><path d="M4 7l11-3v3"/></svg>Bendahara</button>
        <button type="button" class="role r-anggota" data-role="anggota">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="3.2"/><circle cx="5.5" cy="10" r="2.3"/><circle cx="18.5" cy="10" r="2.3"/><path d="M6 20c0-3.5 2.7-6 6-6s6 2.5 6 6z"/></svg>Anggota</button>
      </div>
    </div>

    <div class="below" id="below">
      <a href="#" id="backBtn" hidden>← Kembali</a>
      <p id="daftarNote">Belum punya akun? <a href="daftar.html">Daftar sebagai anggota</a></p>
    </div>

    <p class="copy">© 2025 CV. RANJAU DARAT. Semua Hak Dilindungi.</p>
  </section>
</main>
<script src="js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pengaturan - CV. Ranjau Darat</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/dash.css">
<link rel="stylesheet" href="css/pendaftaran.css">
<link rel="stylesheet" href="css/gaji.css">
<link rel="stylesheet" href="css/keuangan.css">
<link rel="stylesheet" href="css/laporan.css">
</head>
<body>
<p class="loading-page" id="loading">Memeriksa akun...</p>

<div class="shell" id="app" hidden>
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" type="button" aria-label="Buka menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 id="judul">Pengaturan</h1>
      <span class="tgl" id="tgl"></span>
      <div class="chip" id="chip"></div>
    </header>
    <main class="content" id="pengaturan"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/sesi.js"></script>
<script src="js/layout.js"></script>
<script src="js/gaji.js"></script>
<script src="js/keuangan.js"></script>
<script src="js/pengaturan.js"></script>
<script>
  wajibLogin(['bendahara']).then((akun) => {
    if (!akun) return;
    pasangLayout({ peran: 'bendahara', aktif: 'pengaturan', judul: 'Pengaturan', akun });
    document.getElementById('loading').hidden = true;
    document.getElementById('app').hidden = false;
    mulaiPengaturan({ wadah: document.getElementById('pengaturan'), bolehUbah: ['bendahara', 'admin'].includes(akun.jabatan) });
  });
</script>
</body>
</html>
